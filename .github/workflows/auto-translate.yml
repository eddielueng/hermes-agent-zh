name: Auto Translation Sync v2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  UPSTREAM_BRANCH: "main"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"
          echo "=== Current repo info ==="
          git remote -v
          echo "Current branch: $(git branch --show-current)"
          echo "Current HEAD: $(git rev-parse HEAD)"

      - name: Fetch and compare with upstream
        id: fetch_upstream
        run: |
          echo "=== Step 1: Add upstream remote ==="
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          echo "Remotes configured:"
          git remote -v
          
          echo ""
          echo "=== Step 2: Fetch upstream ${UPSTREAM_BRANCH} ==="
          FETCH_OUTPUT=$(git fetch upstream ${UPSTREAM_BRANCH} 2>&1)
          FETCH_EXIT_CODE=$?
          echo "${FETCH_OUTPUT}"
          echo "Fetch exit code: ${FETCH_EXIT_CODE}"
          
          if [ $FETCH_EXIT_CODE -ne 0 ]; then
            echo "❌ FETCH FAILED!"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "error=fetch_failed_exit_${FETCH_EXIT_CODE}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "=== Step 3: Get commit SHAs ==="
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH} 2>&1)
          REMOTE_EXIT_CODE=$?
          
          echo "Local HEAD:  ${LOCAL}"
          echo "Remote HEAD: ${REMOTE}"
          echo "Remote exit code: ${REMOTE_EXIT_CODE}"
          
          if [ $REMOTE_EXIT_CODE -ne 0 ]; then
            echo "❌ Cannot get upstream ref!"
            echo "Available refs:"
            git branch -r | head -10
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "error=no_upstream_ref" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "upstream_commit=${REMOTE}" >> $GITHUB_OUTPUT
          
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "✅ Already up to date (same commit)"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "=== Step 4: Check differences ==="
          
          COMMITS_AHEAD=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo "?")
          echo "Commits ahead: ${COMMITS_AHEAD}"
          
          if [ "$COMMITS_AHEAD" = "?" ] || [ "$COMMITS_AHEAD" = "0" ]; then
            echo "⚠️ Cannot count commits, trying direct merge..."
            
            BRANCH_NAME="auto-sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "${BRANCH_NAME}"
            
            MERGE_OUTPUT=$(git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream" 2>&1) || true
            echo "Merge output: ${MERGE_OUTPUT}"
            
            CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | wc -l)
            echo "Changed files after merge: ${CHANGED_FILES}"
            
            if [ "$CHANGED_FILES" != "0" ] && [ "$CHANGED_FILES" != "" ]; then
              echo "✅ Found changes via merge!"
              echo "Changed files list:"
              git diff --name-only HEAD~1 | head -20
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits_ahead=merged" >> $GITHUB_OUTPUT
              echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
              echo "already_merged=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "No changes after merge, cleaning up..."
              git checkout main 2>/dev/null || git checkout master 2>/dev/null || true
              git branch -D "${BRANCH_NAME}" 2>/dev/null || true
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "✅ Found ${COMMITS_AHEAD} commits to sync"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commits_ahead=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        run: |
          BRANCH_NAME="auto-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
          
          git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream ${UPSTREAM_BRANCH}" || {
            echo "⚠️ Merge had conflicts or warnings, continuing..."
          }
          echo "✅ Merge complete"
          echo "Files changed:"
          git diff --name-only HEAD~1 | head -30

      - name: Setup Python
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: pip install pyyaml

      - name: Run translation
        id: translate
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "[DRY RUN] Preview mode - no files modified"
          else
            echo "[LIVE] Production mode - will modify files"
          fi
          
          mkdir -p output
          
          python auto_translate.py \
            --rules translation_rules.yaml \
            --output output/report.md \
            ${DRY_FLAG} 2>&1 | tee output/log.txt || true
          
          CHANGED=$(git diff --name-only 2>/dev/null | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          
          if [ $CHANGED -gt 0 ]; then
            echo ""
            echo "=== ✅ Translated Files ==="
            git diff --name-only
            echo ""
            echo "=== Diff Stat ==="
            git diff --stat | tail -3
          else
            echo ""
            echo "ℹ️ No new translations needed (files may already be in Chinese)"
          fi

      - name: Commit and push
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A
          FILES="${{ steps.translate.outputs.changed_files }}"
          git commit -m "Auto translate: ${FILES} files translated to Chinese" || echo "No changes to commit"
          git push origin "${branch_name}" || echo "Push failed"
          echo "✅ Done!"

      - name: Create PR
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "==========================================="
          echo "  Creating Pull Request"
          echo "==========================================="
          echo ""
          echo "Branch: ${branch_name}"
          echo "Current branch: $(git branch --show-current)"
          echo "Repository: ${{ github.repository }}"
          
          # 提取仓库所有者（用户名或组织名）
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          echo "Repo owner: ${REPO_OWNER}"
          
          # GitHub API 需要的 head 格式: username:branch_name
          FULL_HEAD="${REPO_OWNER}:${branch_name}"
          echo "Full head ref: ${FULL_HEAD}"
          
          # 显示分支信息
          echo ""
          echo "--- Branch Details ---"
          git log --oneline -3
          echo ""
          echo "--- Verifying Remote Branch ---"
          git ls-remote --heads origin "${branch_name}" && echo "✅ Remote branch exists" || echo "⚠️ Checking remote..."
          
          # 使用 Python 调用 GitHub API（最可靠的方式）
          echo ""
          echo "--- Attempting PR Creation via REST API ---"
          
          python3 << 'PYEOF'
import json
import subprocess
import os
from datetime import datetime

# 环境变量
gh_token = os.environ.get('GH_TOKEN', '')
repo = os.environ.get('GITHUB_REPOSITORY', '${{ github.repository }}')
branch_name = os.environ.get('branch_name', '${branch_name}')
repo_owner = repo.split('/')[0] if '/' in repo else 'unknown'

# 构建完整的 head 引用（GitHub API 要求格式: owner:branch）
head_ref = f"{repo_owner}:{branch_name}"

# PR 内容
pr_title = f"🔄 Auto sync & translate {datetime.now().strftime('%Y-%m-%d')}"
pr_body = f"""## Automated Sync & Translation

### 📊 Sync Details
- **Upstream commits**: ${{ steps.fetch_upstream.outputs.commits_ahead }}
- **Files translated**: ${{ steps.translate.outputs.changed_files }}
- **Source branch**: `{branch_name}`

### 🔄 What Changed
This PR automatically:
1. ✅ Synced latest changes from [nousresearch/hermes-agent](https://github.com/nousresearch/hermes-agent)
2. 🔤 Applied Chinese translations to user-facing strings

### ⚠️ Review Notes
- Please review translations for accuracy
- Merge conflicts (if any) have been auto-resolved
- Upstream code logic is preserved; only UI strings are translated

---
🤖 *Generated by Auto Translation Sync workflow*
"""

# 构建 payload
payload = {
    "title": pr_title,
    "head": head_ref,
    "base": "main",
    "body": pr_body
}

print(f"📤 Creating PR with payload:")
print(f"   Title: {pr_title}")
print(f"   Head:  {head_ref}")
print(f"   Base:  main")
print("")

# 调用 GitHub API
try:
    result = subprocess.run(
        [
            'curl', '-s', '-X', 'POST',
            '-H', f'Authorization: token {gh_token}',
            '-H', 'Accept: application/vnd.github.v3+json',
            '-H', 'Content-Type: application/json',
            f'https://api.github.com/repos/{repo}/pulls',
            '-d', json.dumps(payload)
        ],
        capture_output=True,
        text=True,
        timeout=30
    )
    
    response_text = result.stdout.strip()
    
    try:
        response_data = json.loads(response_text)
        
        if 'html_url' in response_data:
            pr_url = response_data['html_url']
            pr_number = response_data['number']
            
            print("✅ PR CREATED SUCCESSFULLY!")
            print(f"   PR #{pr_number}: {pr_url}")
            
            # 写入输出变量
            output_file = os.environ.get('GITHUB_OUTPUT', '')
            if output_file:
                with open(output_file, 'a') as f:
                    f.write(f"pr_url={pr_url}\n")
                    f.write(f"pr_number={pr_number}\n")
        else:
            error_msg = response_data.get('message', 'Unknown error')
            errors = response_data.get('errors', [])
            
            print(f"❌ API Error: {error_msg}")
            if errors:
                for err in errors:
                    print(f"   - {err.get('message', err)}")
            
    except json.JSONDecodeError as e:
        print(f"❌ Failed to parse response: {e}")
        print(f"   Raw response: {response_text[:500]}")

except Exception as e:
    print(f"❌ Request failed: {e}")

PYEOF

          # 检查 Python 脚本是否成功创建了 PR
          echo ""
          if grep -q "^pr_url=https://" "$GITHUB_OUTPUT" 2>/dev/null; then
            echo "==========================================="
            echo "  ✅ SUCCESS - PR Created!"
            echo "==========================================="
          else
            echo "==========================================="
            echo "  ⚠️ Primary method failed, trying fallback..."
            echo "==========================================="
            
            # 后备方法: gh cli
            echo ""
            echo "--- Fallback: Using gh CLI ---"
            
            gh pr create \
              --head "${branch_name}" \
              --base main \
              --title "Auto sync & translate $(date '+%Y-%m-%d')" \
              --body "$(cat <<EOF
            ## Automated Sync & Translation
            
            - **Synced from**: nousresearch/hermes-agent
            - **Translated files**: ${{ steps.translate.outputs.changed_files }}
            - **Branch**: \`${branch_name}\`
            
            🤖 *Auto-generated by workflow*
            EOF
            )" 2>&1 && {
              echo ""
              echo "✅ PR created via gh CLI fallback!"
            } || {
              echo ""
              echo "==========================================="
              echo "  ❌ All automated methods failed"
              echo "==========================================="
              echo ""
              echo "📋 Manual PR creation required:"
              echo ""
              echo "   Repository: https://github.com/${{ github.repository }}"
              echo "   Compare URL: https://github.com/${{ github.repository }}/compare/main...${branch_name}"
              echo ""
              echo "Click the Compare URL above to manually create the PR."
              echo "pr_url=manual" >> $GITHUB_OUTPUT
            }
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-report-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: sync-and-translate
    if: always()
    steps:
      - run: |
          echo "## Auto Translation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ needs.sync-and-translate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream Commit | \`${{ needs.sync-and-translate.steps.fetch_upstream.outputs.upstream_commit || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes Found | \`${{ needs.sync-and-translate.steps.fetch_upstream.outputs.commits_ahead || '0' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Error | \`${{ needs.sync-and-translate.steps.fetch_upstream.outputs.error || 'none' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Translated Files | \`${{ needs.sync-and-translate.steps.translate.outputs.changed_files || '0' }}\` |" >> $GITHUB_STEP_SUMMARY
