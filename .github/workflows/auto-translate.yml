name: Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Branch to sync'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - dev
      dry_run:
        description: 'Dry run mode'
        required: false
        default: false
        type: boolean
      create_pr:
        description: 'Create PR'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run translation
        id: translate
        run: |
          mkdir -p output
          python auto_translate.py \
            --rules translation_rules.yaml \
            --output output/report.md \
            --dry-run 2>&1 | tee output/log.txt || true
          
          CHANGED=$(git diff --name-only 2>/dev/null | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Translation check complete. Files changed: ${CHANGED}"

      - name: Commit and push
        if: steps.translate.outputs.changed_files != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A
          git commit -m "Auto translation update $(date '+%Y-%m-%d %H:%M')" || true
          git push origin main || true
          echo "Push complete"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: sync-and-translate
    if: always()
    steps:
      - run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ needs.sync-and-translate.result }} |" >> $GITHUB_STEP_SUMMARY
