name: Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no changes)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run translation
        id: translate
        run: |
          echo "=== Translation Mode: ${{ github.event.inputs.dry_run || 'false' }} ==="
          mkdir -p output
          
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "[DRY RUN] Preview mode - no files will be modified"
          else
            echo "[LIVE] Production mode - files will be translated and committed"
          fi
          
          python auto_translate.py \
            --rules translation_rules.yaml \
            --output output/report.md \
            ${DRY_FLAG} 2>&1 | tee output/log.txt
          
          echo ""
          echo "=== Checking for changes ==="
          CHANGED=$(git diff --name-only 2>/dev/null | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          
          if [ $CHANGED -gt 0 ]; then
            echo ""
            echo "=== Changed Files ==="
            git diff --name-only
            echo ""
            echo "=== Diff Summary ==="
            git diff --stat
          fi

      - name: Commit and push
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "=== Committing translations ==="
          git add -A
          git commit -m "Auto translation update $(date '+%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push origin main || echo "Push failed (may already be up to date)"
          echo "Done!"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-report-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: sync-and-translate
    if: always()
    steps:
      - run: |
          echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ needs.sync-and-translate.result }} |" >> $GITHUB_STEP_SUMMARY
