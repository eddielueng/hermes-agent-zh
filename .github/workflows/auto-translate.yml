name: Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 */6 * * *'

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  UPSTREAM_BRANCH: "main"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"

      - name: Fetch upstream
        id: fetch_upstream
        run: |
          echo "Adding upstream remote..."
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git

          echo "Fetching upstream..."
          if ! git fetch upstream ${UPSTREAM_BRANCH}; then
            echo "::error::Failed to fetch upstream"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          echo "upstream_commit=${REMOTE}" >> $GITHUB_OUTPUT

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::notice::Already up to date"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS_AHEAD=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} || echo "0")
          echo "::notice::Found ${COMMITS_AHEAD} commits to sync"

          if [ "$COMMITS_AHEAD" = "0" ]; then
            BRANCH_NAME="sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "${BRANCH_NAME}"
            git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream" || true

            if [ $(git diff --name-only HEAD~1 | wc -l) -gt 0 ]; then
              echo "::notice::Found changes via merge"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits_ahead=merged" >> $GITHUB_OUTPUT
              echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
              echo "already_merged=true" >> $GITHUB_OUTPUT
              exit 0
            else
              git checkout main || git checkout master || true
              git branch -D "${BRANCH_NAME}" || true
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commits_ahead=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          fi

      - name: Merge changes
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        run: |
          BRANCH_NAME="sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
          git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream ${UPSTREAM_BRANCH}" || echo "::warning::Merge has conflicts"

      - name: Resolve conflicts
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        continue-on-error: true
        run: |
          echo "Checking for merge conflicts..."
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>&1)
          echo "Conflict files output: ${CONFLICT_FILES}"

          if [ -n "$CONFLICT_FILES" ]; then
            echo "::warning::Found conflicts, resolving..."
            CONFLICT_COUNT=$(echo "$CONFLICT_FILES" | wc -l)
            echo "::notice::Resolving ${CONFLICT_COUNT} conflicting files"

            echo "$CONFLICT_FILES" | while read -r file; do
              if [ -f "$file" ]; then
                echo "  Resolving: $file (taking upstream version)"
                git checkout --theirs "$file"
                git add "$file"
              else
                echo "::warning::File not found: $file, skipping..."
              fi
            done

            # Check if all conflicts are resolved
            REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null | wc -l)
            if [ "$REMAINING" = "0" ]; then
              echo "::notice::All conflicts resolved successfully"
              git commit -m "resolve: Auto-resolved ${CONFLICT_COUNT} conflict files" --no-edit || {
                echo "::error::Failed to commit resolved conflicts, but continuing..."
              }
            else
              echo "::warning::Still have ${REMAINING} unresolved conflicts! Continuing anyway..."
              git diff --name-only --diff-filter=U
            fi
          else
            echo "::notice::No conflicts found, clean merge!"
          fi

      - name: Validate Python files BEFORE translation
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          echo "=== Validating all .py files before translation ==="
          ERROR_COUNT=0
          TOTAL=0
          while IFS= read -r -d '' file; do
            TOTAL=$((TOTAL + 1))
            if ! python3 -c "import ast; ast.parse(open('$file', 'r', encoding='utf-8-sig').read())" 2>/dev/null; then
              echo "::error::BROKEN FILE (pre-translation): $file"
              # Try to restore from upstream
              git checkout --theirs "$file" 2>/dev/null || {
                git checkout upstream/main -- "$file" 2>/dev/null || true
              }
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(find . -name "*.py" -type f -print0)
          echo "Checked $TOTAL files, found $ERROR_COUNT broken files"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::warning::$ERROR_COUNT files were restored from upstream before translation"
          fi

      - name: Setup Python
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: pip install pyyaml

      - name: Run translation
        id: translate
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          mkdir -p output
          
          # CRITICAL: Handle .backup files before translation
          # SKILL.md files get renamed to SKILL.md.backup during upstream merge
          # We need to RESTORE them, not delete them!
          echo "=== Handling .backup files ==="
          
          # Restore SKILL.md from .backup files (these are skill definitions, not conflict backups)
          echo "Restoring SKILL.md files from .backup..."
          find . -name "SKILL.md.backup" -type f 2>/dev/null | while read -r backup_file; do
            target="${backup_file%.backup}"
            cp "$backup_file" "$target" 2>/dev/null || true
            echo "  Restored: $target"
          done
          
          # Delete all remaining .backup files (actual merge conflict backups with markers)
          echo "Removing other .backup files..."
          find . -name "*.backup" -delete 2>/dev/null || true
          
          BACKUP_COUNT=$(find . -name "*.backup" 2>/dev/null | wc -l)
          SKILL_COUNT=$(find . -name "SKILL.md" -type f 2>/dev/null | wc -l)
          echo "Remaining .backup: ${BACKUP_COUNT}, SKILL.md files: ${SKILL_COUNT}"
          
          git add -u "*.backup" 2>/dev/null || true
          git rm --cached "*.backup" 2>/dev/null || true
          find . -name "*.backup" -delete 2>/dev/null || true
          
          echo "=== Running translation with upstream sync ==="
          echo "Upstream commit: ${{ steps.fetch_upstream.outputs.upstream_commit }}"
          python auto_translate.py --rules translation_rules.yaml --upstream nousresearch/hermes-agent --output output/report.md 2>&1 | tee output/log.txt || true
          CHANGED=$(git diff --name-only | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Translation complete. Changed files: ${CHANGED}"

      - name: Validate Python files AFTER translation
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        run: |
          echo "=== Validating all .py files after translation ==="
          ERROR_COUNT=0
          FIXED_COUNT=0
          for file in $(git diff --name-only '*.py'); do
            if [ -f "$file" ]; then
              if ! python3 -c "import ast; ast.parse(open('$file', 'r', encoding='utf-8-sig').read())" 2>/dev/null; then
                echo "::error::BROKEN FILE (post-translation): $file — restoring from backup or upstream"
                # Try .backup first, then upstream
                if [ -f "${file}.backup" ]; then
                  cp "${file}.backup" "$file"
                  echo "  Restored from .backup"
                else
                  git checkout upstream/main -- "$file" 2>/dev/null || git checkout HEAD -- "$file" 2>/dev/null || true
                  echo "  Restored from upstream/HEAD"
                fi
                FIXED_COUNT=$((FIXED_COUNT + 1))
              fi
            fi
          done
          # Also do a full scan for any other broken files
          while IFS= read -r -d '' file; do
            if ! python3 -c "import ast; ast.parse(open('$file', 'r', encoding='utf-8-sig').read())" 2>/dev/null; then
              echo "::error::STILL BROKEN: $file — attempting restore"
              git checkout upstream/main -- "$file" 2>/dev/null || true
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(find . -name "*.py" -type f -print0)
          echo "Fixed $FIXED_COUNT files, $ERROR_COUNT still broken"
          find . -name "*.backup" -delete 2>/dev/null || true

      - name: Commit and push to main
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        run: |
          echo "=== Preparing to push directly to main ==="
          
          # CRITICAL: Clean up .backup files first (they cause merge conflicts)
          echo "Removing .backup files..."
          find . -name "*.backup" -delete 2>/dev/null || true
          git add -A 2>/dev/null || true
          
          # Force resolve any remaining merge conflicts by accepting upstream version
          echo "Checking for unresolved conflicts..."
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::warning::Found unresolved conflicts, force resolving..."
            git diff --name-only --diff-filter=U | while read -r file; do
              echo "  Resolving: $file (accepting ours)"
              git checkout --ours "$file" 2>/dev/null || git rm --cached "$file" 2>/dev/null || true
              git add "$file" 2>/dev/null || true
            done
          fi
          
          # Reset working directory to clean state for branch switching
          git reset HEAD 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          
          # If we're on a sync branch (from already_merged or Merge changes step), switch back to main first
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Current branch: ${CURRENT_BRANCH}"
          
          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "Switching from ${CURRENT_BRANCH} to main..."
            git checkout main || {
              echo "::error::Failed to checkout main, forcing reset..."
              git reset --hard origin/main || exit 1
            }
            
            # Try to merge the translated changes from the sync branch
            echo "Merging translated changes from ${CURRENT_BRANCH}..."
            if git merge "${CURRENT_BRANCH}" --no-edit -m "merge: Auto-sync & translate $(date '+%Y-%m-%d %H:%M')" 2>/dev/null; then
              echo "::notice::Merge successful"
            else
              echo "::warning::Merge had conflicts, resolving automatically..."
              git diff --name-only --diff-filter=U | while read -r file; do
                echo "  Auto-resolving: $file"
                git checkout --theirs "$file" 2>/dev/null || git checkout --ours "$file" 2>/dev/null || true
                git add "$file" 2>/dev/null || true
              done
              # Commit the resolution if there are staged changes
              if [ -n "$(git diff --cached --name-only)" ]; then
                git commit -m "resolve: Auto-resolved merge conflicts" --no-edit || true
              else
                git merge --abort 2>/dev/null || true
              fi
            fi
            
            # Clean up the temp branch
            git branch -D "${CURRENT_BRANCH}" 2>/dev/null || true
          fi
          
          # Final cleanup: remove any remaining .backup files
          find . -name "*.backup" -delete 2>/dev/null || true
          
          # Add all translatable files
          git add '*.py' '*.md' '*.yaml' '*.yml' 2>/dev/null || true
          git add -u '*.py' '*.md' '*.yaml' '*.yml' 2>/dev/null || true
          
          # Check if there are actual changes
          STAGED=$(git diff --cached --name-only | wc -l)
          echo "Staged files count: ${STAGED}"
          
          if [ "$STAGED" = "0" ]; then
            echo "::notice::No files to commit (already up to date or no translation needed)"
            exit 0
          fi
          
          echo "Files to commit:"
          git diff --cached --name-only
          
          # Commit directly on main
          git commit -m "🔄 Auto-sync & translate $(date '+%Y-%m-%d %H:%M')
          
          - Upstream: ${{ steps.fetch_upstream.outputs.upstream_commit }}
          - Files: $(git diff --cached --name-only | wc -l)" || {
            echo "::warning::Nothing new to commit, but there were staged files. May need amend."
          }
          
          # Push directly to main
          echo "Pushing to main branch..."
          git push origin main
          
          echo "✅ Successfully pushed to main!"
