name: Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 2 * * *'

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  UPSTREAM_BRANCH: "main"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"

      - name: Fetch upstream
        id: fetch_upstream
        run: |
          echo "Adding upstream remote..."
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git

          echo "Fetching upstream..."
          if ! git fetch upstream ${UPSTREAM_BRANCH}; then
            echo "::error::Failed to fetch upstream"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH})
          echo "upstream_commit=${REMOTE}" >> $GITHUB_OUTPUT

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::notice::Already up to date"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS_AHEAD=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} || echo "0")
          echo "::notice::Found ${COMMITS_AHEAD} commits to sync"

          if [ "$COMMITS_AHEAD" = "0" ]; then
            BRANCH_NAME="sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "${BRANCH_NAME}"
            git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream" || true

            if [ $(git diff --name-only HEAD~1 | wc -l) -gt 0 ]; then
              echo "::notice::Found changes via merge"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits_ahead=merged" >> $GITHUB_OUTPUT
              echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
              echo "already_merged=true" >> $GITHUB_OUTPUT
              exit 0
            else
              git checkout main || git checkout master || true
              git branch -D "${BRANCH_NAME}" || true
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commits_ahead=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          fi

      - name: Merge changes
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        run: |
          BRANCH_NAME="sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
          git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream ${UPSTREAM_BRANCH}" || echo "::warning::Merge has conflicts"

      - name: Resolve conflicts
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        run: |
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICT_FILES" ]; then
            echo "::warning::Resolving conflicts..."
            echo "$CONFLICT_FILES" | while read -r file; do
              if [ -f "$file" ]; then
                git checkout --theirs "$file"
                git add "$file"
              fi
            done
            git commit -m "resolve: Auto-resolved conflicts" --no-edit || true
          fi

      - name: Setup Python
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: pip install pyyaml

      - name: Run translation
        id: translate
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          mkdir -p output
          python auto_translate.py --rules translation_rules.yaml --output output/report.md 2>&1 | tee output/log.txt || true
          CHANGED=$(git diff --name-only | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT

      - name: Commit and push
        id: commit
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        run: |
          git add '*.py' '*.md' '*.yaml' '*.yml' || true
          find . -name "*.backup" -delete || true
          git add -u '*.py' '*.md' '*.yaml' '*.yml' || true

          if [ $(git diff --cached --name-only | wc -l) -eq 0 ]; then
            echo "changed_files=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: Auto sync & translate" || true
          BRANCH="sync-$(date +%Y%m%d-%H%M%S)"
          git branch -M "${BRANCH}"
          git push origin "${BRANCH}" --force
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create PR
        id: create_pr
        if: steps.commit.outputs.branch != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/eddielueng/hermes-agent-zh/pulls" \
            -d "{\"title\": \"Auto sync & translate $(date '+%Y-%m-%d')\", \"head\": \"${{ steps.commit.outputs.branch }}\", \"base\": \"main\", \"body\": \"Automated sync\"}")

          PR_NUM=$(echo "${RESPONSE}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('number', 0))" 2>/dev/null || echo "0")
          if [ "$PR_NUM" != "0" ]; then
            echo "::notice::PR created #${PR_NUM}"
            echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
          else
            echo "::error::PR creation failed"
          fi

      - name: Merge PR
        if: steps.create_pr.outputs.pr_number != '' && steps.create_pr.outputs.pr_number != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          MERGE_RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/eddielueng/hermes-agent-zh/pulls/${{ steps.create_pr.outputs.pr_number }}/merge" \
            -d '{"merge_method": "squash"}')

          if echo "${MERGE_RESPONSE}" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('merged') else 1)" 2>/dev/null; then
            echo "::notice::PR merged successfully"
          else
            echo "::warning::Auto-merge failed"
          fi
