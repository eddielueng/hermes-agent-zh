# =============================================
# Hermes Agent 中文版 - 自动化汉化同步工作流
# =============================================

name: 🔄 Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: '要同步的上游分支'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - dev
          - next
      dry_run:
        description: '预览模式（不实际修改）'
        required: false
        default: false
        type: boolean
      create_pr:
        description: '是否创建 PR（false 则直接推送到 main）'
        required: false
        default: true
        type: boolean

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  UPSTREAM_BRANCH: "${{ github.event.inputs.upstream_branch || 'main' }}"
  PYTHON_VERSION: "3.11"
  DRY_RUN: "${{ github.event.inputs.dry_run || 'false' }}"
  CREATE_PR: "${{ github.event.inputs.create_pr || 'true' }}"

jobs:
  sync-and-translate:
    name: 🔄 Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global user.name "Hermes Agent Bot"
          git config --global user.email "bot@hermes-zh.com"
          if ! git remote get-url upstream &>/dev/null; then
            git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          fi

      - name: 📥 Fetch upstream changes
        id: fetch_upstream
        run: |
          echo "🔄 正在从 ${UPSTREAM_REPO} 获取最新代码..."
          if ! git remote get-url upstream &>/dev/null; then
            git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          fi
          set +e
          git fetch upstream ${UPSTREAM_BRANCH} 2>&1 || {
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "error=fetch_failed" >> $GITHUB_OUTPUT
            exit 0
          }
          set -e
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo "")
          if [ -z "$REMOTE" ] || [ "$LOCAL" = "$REMOTE" ]; then
            if [ -z "$REMOTE" ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits_ahead=0" >> $GITHUB_OUTPUT
              echo "upstream_commit=initial" >> $GITHUB_OUTPUT
              echo "first_run=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          COMMITS_AHEAD=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo "0")
          echo "📊 发现 ${COMMITS_AHEAD} 个新提交"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "commits_ahead=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          echo "upstream_commit=${REMOTE}" >> $GITHUB_OUTPUT

      - name: 🔀 Merge upstream changes
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          echo "🔀 正在合并上游更改..."
          if [ "$CREATE_PR" = "true" ]; then
            BRANCH_NAME="auto-sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV
          fi
          git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream" || {
            echo "⚠️ 合并出现冲突或错误"
          }
          echo "✅ 合并完成"

      - name: 🐍 Setup Python
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🌐 Run auto translation
        id: translate
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          echo "🌐 开始执行自动汉化..."
          mkdir -p output
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          set +e
          python auto_translate.py --rules translation_rules.yaml --upstream ${UPSTREAM_REPO} --branch ${UPSTREAM_BRANCH} --output output/translation_report.md ${DRY_RUN_FLAG} 2>&1 | tee output/translation_output.log
          TRANSLATE_EXIT_CODE=$?
          set -e
          CHANGED_FILES=$(git diff --name-only 2>/dev/null | wc -l)
          echo "📊 检测到变更文件数: ${CHANGED_FILES}"
          if [ $CHANGED_FILES -gt 0 ]; then
            TRANSLATIONS=$(git diff --stat 2>/dev/null | tail -1 | awk '{print $4}' || echo "0")
            echo "changed_files=${CHANGED_FILES}" >> $GITHUB_OUTPUT
            echo "translations=${TRANSLATIONS}" >> $GITHUB_OUTPUT
            echo "✅ 翻译完成！发现 ${CHANGED_FILES} 个文件有变更"
          else
            echo "changed_files=0" >> $GITHUB_OUTPUT
            echo "translations=0" >> $GITHUB_OUTPUT
            if [ $TRANSLATE_EXIT_CODE -ne 0 ]; then
              echo "error=translate_failed" >> $GITHUB_OUTPUT
              echo "⚠️ 翻译脚本执行失败（退出码: ${TRANSLATE_EXIT_CODE}）"
              tail -20 output/translation_output.log 2>/dev/null || true
            else
              echo "status=no_changes" >> $GITHUB_OUTPUT
              echo "ℹ️ 无需翻译"
            fi
          fi

      - name: 💾 Commit changes
        if: steps.translate.outputs.changed_files != '0'
        run: |
          git add -A
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          COMMITS="${{ steps.fetch_upstream.outputs.commits_ahead }}"
          TRANS="${{ steps.translate.outputs.translations }}"
          FILES="${{ steps.translate.outputs.changed_files }}"
          printf "🔄 自动汉化同步 - %s\n\n✨ 主要更新：\n- 同步上游 %s 个提交\n- 自动翻译 %s 条用户可见文本\n- 更新 %s 个文件\n\n🤖 *此提交由 GitHub Actions 自动生成*" "$TIMESTAMP" "$COMMITS" "$TRANS" "$FILES" > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt || echo "ℹ️ 无需提交"
          echo "✅ 已提交更改"

      - name: 🚀 Push or Create PR
        if: steps.translate.outputs.changed_files != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ "$CREATE_PR" = "true" ] && [ -n "$branch_name" ]; then
            echo "📤 正在创建 Pull Request..."
            PR_DATE=$(date '+%Y-%m-%d')
            SYNC_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            UPSTREAM_COMMIT="${{ steps.fetch_upstream.outputs.upstream_commit }}"
            COMMITS="${{ steps.fetch_upstream.outputs.commits_ahead }}"
            TRANS="${{ steps.translate.outputs.translations }}"
            FILES="${{ steps.translate.outputs.changed_files }}"
            COMMIT_SHORT=$(echo "${UPSTREAM_COMMIT}" | cut -c1-7)
            DIFF_STAT=$(git diff --stat HEAD~1 2>/dev/null | head -20 || echo "无变更统计")
            cat > /tmp/pr_body.txt << ENDOFFILE
## 🔄 自动化汉化同步报告

**同步时间**: ${SYNC_TIME}
**上游 commit**: \`${COMMIT_SHORT}\`
**修改文件数**: ${FILES}

### ✅ 本次汉化内容

- **同步上游**: ${COMMITS} 个新提交
- **翻译文本**: 约 ${TRANS} 条用户可见文本
- **涉及文件**: ${FILES} 个

### 📋 详细变更

<details>
<summary>点击查看详细翻译记录</summary>

\`\`\`
${DIFF_STAT}
\`\`\`

</details>

---

🤖 *此 PR 由 Auto Translation Workflow 自动生成*

ℹ️ **审核建议**:
1. 检查翻译是否准确
2. 测试功能是否正常
3. 如有问题请评论或关闭此 PR
ENDOFFILE
            gh pr create \
              --title "🔄 自动汉化同步 - ${PR_DATE} (${COMMITS} commits)" \
              --body-file /tmp/pr_body.txt \
              --label "automated" \
              --label "translation" \
              --base main || {
                echo "⚠️ PR 创建失败或已存在"
                git push origin "$branch_name" || true
              }
            echo "✅ PR 创建成功！"
          else
            echo "🚀 正在推送到 main 分支..."
            git push origin main
            echo "✅ 推送成功！"
          fi

      - name: 📄 Upload translation report
        if: always() && steps.translate.outputs.changed_files != '0'
        uses: actions/upload-artifact@v4
        with:
          name: translation-report-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📢 Send notification
        if: success() && steps.translate.outputs.changed_files != '0'
        run: |
          echo "🎉 自动化汉化流程已完成！"
          COMMITS="${{ steps.fetch_upstream.outputs.commits_ahead }}"
          FILES="${{ steps.translate.outputs.changed_files }}"
          TRANS="${{ steps.translate.outputs.translations }}"
          echo "   • 上游新提交: ${COMMITS}"
          echo "   • 变更文件数: ${FILES}"
          echo "   • 翻译文本数: ~${TRANS}"

  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: sync-and-translate
    if: always()
    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🔄 自动化汉化工作流总结" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 上游仓库 | ${{ env.UPSTREAM_REPO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 运行状态 | ${{ needs.sync-and-translate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 运行时间 | $(date) |" >> $GITHUB_STEP_SUMMARY
