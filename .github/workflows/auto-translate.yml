name: Auto Translation Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: false
        type: boolean

  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-translation
  cancel-in-progress: false

env:
  UPSTREAM_REPO: "nousresearch/hermes-agent"
  UPSTREAM_BRANCH: "main"
  PYTHON_VERSION: "3.11"

jobs:
  sync-and-translate:
    name: Sync & Translate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Hermes Bot"
          git config --global user.email "bot@hermes-zh.com"

      - name: Fetch and compare with upstream
        id: fetch_upstream
        run: |
          echo "=== Adding upstream remote ==="
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git 2>/dev/null || true
          
          echo "=== Fetching upstream ==="
          set +e
          git fetch upstream ${UPSTREAM_BRANCH} 2>&1
          FETCH_OK=$?
          set -e
          
          if [ $FETCH_OK -ne 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "error=fetch_failed" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo "")
          
          echo "Local HEAD:  ${LOCAL}"
          echo "Remote HEAD: ${REMOTE}"
          echo "upstream_commit=${REMOTE}" >> $GITHUB_OUTPUT
          
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "Already up to date (same commit)"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "=== Checking for differences ==="
          
          set +e
          COMMITS_AHEAD=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH} 2>/dev/null || echo "?")
          set -e
          
          echo "Commits ahead: ${COMMITS_AHEAD}"
          
          if [ "$COMMITS_AHEAD" = "?" ] || [ "$COMMITS_AHEAD" = "0" ]; then
            echo "Cannot count commits, checking file diff instead..."
            
            BRANCH_NAME="auto-sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "${BRANCH_NAME}" 2>/dev/null || true
            
            set +e
            git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream" 2>&1
            MERGE_RESULT=$?
            set -e
            
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null | wc -l)
            
            if [ $CHANGED -gt 0 ]; then
              echo "Found ${CHANGED} changed files from merge"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits_ahead=merged" >> $GITHUB_OUTPUT
              echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
              echo "already_merged=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "No changes after merge"
              git checkout main 2>/dev/null || true
              git branch -D "${BRANCH_NAME}" 2>/dev/null || true
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commits_ahead=${COMMITS_AHEAD}" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.fetch_upstream.outputs.has_changes == 'true' && steps.fetch_upstream.outputs.already_merged != 'true'
        run: |
          BRANCH_NAME="auto-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "${BRANCH_NAME}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_ENV
          
          git merge upstream/${UPSTREAM_BRANCH} --no-edit -m "merge upstream ${UPSTREAM_BRANCH}" || {
            echo "Merge had conflicts or warnings, continuing..."
          }
          echo "Merge complete. Changed files:"
          git diff --name-only HEAD~1 2>/dev/null | head -30

      - name: Setup Python
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: pip install pyyaml

      - name: Run translation
        id: translate
        if: steps.fetch_upstream.outputs.has_changes == 'true'
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "[DRY RUN] Preview mode"
          else
            echo "[LIVE] Production mode - will translate and commit"
          fi
          
          mkdir -p output
          
          python auto_translate.py \
            --rules translation_rules.yaml \
            --output output/report.md \
            ${DRY_FLAG} 2>&1 | tee output/log.txt || true
          
          CHANGED=$(git diff --name-only 2>/dev/null | wc -l)
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          
          if [ $CHANGED -gt 0 ]; then
            echo ""
            echo "=== Files translated ==="
            git diff --name-only
            echo ""
            echo "=== Summary ==="
            git diff --stat | tail -3
          fi

      - name: Commit and push
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add -A
          FILES="${{ steps.translate.outputs.changed_files }}"
          git commit -m "Auto translate: ${FILES} files translated to Chinese" || echo "No changes to commit"
          git push origin "${branch_name}" || echo "Push failed"
          echo "Push complete"

      - name: Create PR
        if: steps.translate.outputs.changed_files != '0' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr create \
            --title "Auto sync & translate $(date '+%Y-%m-%d')" \
            --body "Automated: Sync from upstream nousresearch/hermes-agent and Chinese translation" \
            --label "automated" \
            --label "translation" \
            --base main || echo "PR exists or failed"

      - name: Upload report
        if: always() && steps.fetch_upstream.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: translation-report-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: sync-and-translate
    if: always()
    steps:
      - run: |
          echo "## Auto Translation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ needs.sync-and-translate.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Upstream | \`${{ needs.sync-and-translate.steps.fetch_upstream.outputs.upstream_commit || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes Found | \`${{ needs.sync-and-translate.steps.fetch_upstream.outputs.commits_ahead || '0' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Translated | \`${{ needs.sync-and-translate.steps.translate.outputs.changed_files || '0' }}\` files |" >> $GITHUB_STEP_SUMMARY
