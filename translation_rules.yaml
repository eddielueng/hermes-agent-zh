# =============================================
# Hermes Agent 中文版 - 翻译规则配置
# =============================================
# 
# 说明：此文件定义自动化汉化的所有规则
# 当官方仓库更新时，auto_translate.py 会根据这些规则自动翻译
#
# 使用方法：
#   python auto_translate.py --rules translation_rules.yaml --upstream nousresearch/hermes-agent
#
# =============================================

# =============================================
# 🎯 第一部分：全局设置
# =============================================

global:
  # 是否启用自动翻译
  enabled: true
  
  # 日志级别: DEBUG, INFO, WARNING, ERROR
  log_level: INFO
  
  # 备份原始文件（安全措施）
  backup_original: true
  
  # 翻译模式:
  #   strict - 只翻译明确匹配的模式（推荐）
  #   aggressive - 尝试翻译更多文本（可能有误译）
  mode: strict
  
  # 需要处理的文件类型
  file_patterns:
    - "*.py"
    - "*.md"
    - "*.yaml"
    - "*.yml"
    - "*.json"

# =============================================
# 🔧 第二部分：通用翻译映射表
# =============================================
# 这些规则适用于所有文件

