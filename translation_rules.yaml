# =============================================
# 🚫 第四部分：排除列表（不翻译的内容）
# =============================================

exclusions:
  # 不翻译代码中的技术标识符
  - pattern: "^import |^from |^class |^def |^async def "
    reason: "Python 代码结构关键字"
    
  # 不翻译变量名和函数名
  - pattern: "\\b(True|False|None|self|cls|args|kwargs|config|logger)\\b"
    reason: "Python 内置标识符"
    
  # 不翻译 API 路径和 URL
  - pattern: "https?://[\\w\\./-]+"
    reason: "URL 地址"
    
  # 不翻译环境变量名
  - pattern: "\\b[A-Z_]{2,}\\b"
    when: "in_string_literal"
    reason: "环境变量名"
    
  # 不翻译命令名称本身
  - pattern: "^/[a-z-]+"
    reason: "斜杠命令"
    
  # 不翻译版本号和数字
  - pattern: "\\bv?\\d+\\.\\d+(\\.\\d+)?(-[a-z]+)?\\b"
    reason: "版本号"
    
  # 不翻译日志格式字符串（调试信息）
  - pattern: "logger\\.(debug|info|warning|error)\\("
    reason: "日志调用"

  # 不翻译 f-string 变量占位符
  - pattern: "\\{[^}]+\\}"
    reason: "f-string/格式化变量占位符"

  # 不翻译 markdown 代码块内容
  - pattern: "```[\\s\\S]*?```"
    reason: "Markdown 代码块"

  # 不翻译 docstring（三引号长字符串）
  - pattern: '"""[\\s\\S]*?"""'
    reason: "文档字符串"

  # 不翻译路径字符串
  - pattern: '[\'"][\\w/.-]+\\.(py|yaml|yml|json|md|txt|sh)[\'"]'
    reason: "文件路径引用"

# =============================================
# ⚙️ 第五部分：高级选项
# =============================================

advanced:
  # 并行处理线程数
  workers: 4
  
  # 最大文件大小限制（MB）
  max_file_size: 10
  
  # 单次提交的最大文件数量
  max_files_per_commit: 50
  
  # 是否自动创建 PR（false 则直接推送到 main）
  create_pr: true
  
  # PR 标题模板
  pr_title_template: "🔄 自动汉化同步 - {date} ({commit_count} commits)"
  
  # PR 描述模板
  pr_body_template: |
    ## 🔄 自动汉化同步
    
    **同步时间**: {date}
    **上游 commit**: `{upstream_commit}`
    **修改文件数**: {files_changed}
    
    ### ✅ 本次汉化内容
    
    {changes_summary}
    
    ---
    
    🤖 *此 PR 由 auto_translate.py 自动生成*
  
  # Commit message 模板
  commit_message_template: |
    🔄 自动汉化: 同步上游 {upstream_commit_short}
    
    自动翻译新增/修改的用户可见文本
    - 新增文件: {new_files}
    - 修改文件: {modified_files}
    - 翻译条目: {translation_count}

# =============================================
# 📊 第六部分：通知配置（可选）
# =============================================

notifications:
  # 完成后是否发送通知
  enabled: false
  
  # 通知方式: email, slack, webhook
  type: webhook
  
  # Webhook URL
  webhook_url: ""
  
  # Slack 配置
  slack_channel: ""
  slack_webhook: ""
  
  # Email 配置
  smtp_server: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  recipients: []
