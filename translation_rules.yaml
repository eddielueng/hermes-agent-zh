  "just now": "刚刚"
  " ago": "前"
  "yesterday": "昨天"
  "minutes ago": "分钟前"
  "hours ago": "小时前"
  "days ago": "天前"
  
  # 布尔值显示（完整格式）
  "(current)": "（当前）"
