  "Warning:": "警告："
  "Success:": "成功："
  "Failed:": "失败："
  "Cancelled.": "已取消。"
  
  # 常用动词短语（带空格确保是短语而非单词）
  "Starting ": "正在启动 "
  "Stopping ": "正在停止 "
  "Connecting to": "连接到"
  "Disconnected from": "已断开连接"
  "Loading ": "正在加载 "
  "Saving ": "正在保存 "
  "Created ": "已创建 "
  "Deleted ": "已删除 "
  "Updated ": "已更新 "
  "Installed ": "已安装 "
