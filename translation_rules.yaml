  # 用户交互提示（完整短语）
  "Enter ": "输入 "
  "Select ": "选择 "
  "Choose ": "选择 "
  "Press ": "按 "
  "Type ": "输入 "
  "Confirm": "确认"
  "Cancel": "取消"
  "Skip": "跳过"
  "Retry": "重试"
  "Continue": "继续"
  "Back": "返回"
  "Exit": "退出"
